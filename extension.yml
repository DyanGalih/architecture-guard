schema_version: "1.0"

extension:
  id: "architecture-guard"
  name: "Architecture Guard"
  version: "2.2.1"
  description: "Framework-agnostic architecture review extension for validating implementation against governance and architecture constitutions, detecting architectural drift, and generating non-blocking refactor tasks."
  author: "DyanGalih"
  repository: "https://github.com/DyanGalih/spec-kit-architecture-guard"
  license: "MIT"
  homepage: "https://github.com/DyanGalih/spec-kit-architecture-guard"

requires:
  speckit_version: ">=0.1.0"
  commands:
    - "speckit.specify"
    - "speckit.clarify"
    - "speckit.analyze"
    - "speckit.plan"
    - "speckit.tasks"
    - "speckit.implement"

recommends:
  extensions:
    - "memory-md"
    - "security-review"

hooks:
  after_plan:
    command: "speckit.architecture-guard.ag-violation-detection"
    optional: true
    prompt: "Would you like to scan the technical plan for architectural drift and Constitution violations?"
  after_tasks:
    command: "speckit.architecture-guard.ag-refactor-generator"
    optional: true
    prompt: "Would you like to generate architectural refactor tasks before implementation?"
  after_implement:
    command: "speckit.architecture-guard.ag-review-implementation"
    optional: true
    prompt: "Would you like to run a post-implementation architecture review?"

provides:
  commands:
    - name: "speckit.architecture-guard.ag-governed-discover"
      file: "commands/governed-discover.md"
      description: "Facilitate an architecture-aware discussion to flesh out ideas before generating a formal specification."
    - name: "speckit.architecture-guard.ag-governed-spec"
      file: "commands/governed-spec.md"
      description: "Orchestrate governed specification by chaining speckit.specify and speckit.clarify with architecture and memory context validation, plus an auto-fix loop."
    - name: "speckit.architecture-guard.ag-governed-delivery"
      file: "commands/governed-delivery.md"
      description: "Run the recommended resumable plan-to-tasks workflow with flash-mem context, security review, architecture gates, and analysis."
    - name: "speckit.architecture-guard.ag-governed-plan"
      file: "commands/governed-plan.md"
      description: "Orchestrate governed planning across flash-mem, Security Review, and Architecture Guard."
    - name: "speckit.architecture-guard.ag-governed-tasks"
      file: "commands/governed-tasks.md"
      description: "Generate or validate implementation tasks with flash-mem context, security constraints, and architecture awareness."
    - name: "speckit.architecture-guard.ag-governed-implement"
      file: "commands/governed-implement.md"
      description: "Run implementation with flash-mem context, then review against security and architecture constraints."
    - name: "speckit.architecture-guard.ag-workflow"
      file: "commands/workflow.md"
      description: "Run a single architecture workflow with memory-first flash-mem context and optional Security Review handoff."
    - name: "speckit.architecture-guard.ag-review-artifacts"
      file: "commands/review-artifacts.md"
      description: "Review specification and planning artifacts against architectural rules without reading code."
    - name: "speckit.architecture-guard.ag-review-implementation"
      file: "commands/review-implementation.md"
      description: "Review implementation code against active specifications and constitutions."
    - name: "speckit.architecture-guard.ag-violation-detection"
      file: "commands/violation-detection.md"
      description: "Detect architecture violations in plans, tasks, and implementation summaries."
    - name: "speckit.architecture-guard.ag-refactor-generator"
      file: "commands/refactor-generator.md"
      description: "Convert architecture violations into structured refactor tasks."
    - name: "speckit.architecture-guard.ag-apply"
      file: "commands/apply.md"
      description: "Apply approved architecture refactors to plan and task artifacts."
    - name: "speckit.architecture-guard.ag-init"
      file: "commands/init.md"
      description: "Initialize or update the Project Constitution for Architecture Guard."
    - name: "speckit.architecture-guard.ag-init-brownfield"
      file: "commands/init-brownfield.md"
      description: "Initialize Architecture Guard for an existing codebase by mapping the current state before governance work."
    - name: "speckit.architecture-guard.ag-consolidate-specs"
      file: "commands/consolidate-specs.md"
      description: "Generate a compact, provenance-aware local fallback index from feature specifications."
    - name: "speckit.architecture-guard.ag-verify"
      file: "commands/verify.md"
      description: "Perform an architecture-aware verification gate validating implementation against spec, plan, tasks, and constitution."

tags:
  - "architecture"
  - "spec-kit"
  - "review"
  - "refactor"
  - "workflow"
  - "governance"
  - "guardrails"
  - "hygiene"
