schema_version: "1.0"

extension:
  id: "architecture-guard"
  name: "Architecture Guard"
  version: "2.4.1"
  description: "Framework-agnostic architecture review extension for validating implementation against governance and architecture constitutions, detecting architectural drift, and generating non-blocking refactor tasks."
  author: "DyanGalih"
  repository: "https://github.com/DyanGalih/architecture-guard"
  license: "MIT"
  homepage: "https://github.com/DyanGalih/architecture-guard"

requires:
  speckit_version: ">=0.1.0"
  commands:
    - "speckit.specify"
    - "speckit.clarify"
    - "speckit.analyze"
    - "speckit.plan"
    - "speckit.tasks"
    - "speckit.implement"

recommends:
  extensions:
    - "memory-md"
    - "security-review"

hooks:
  after_plan:
    command: "speckit.architecture-guard.ag-violation-detection"
    optional: true
    prompt: "Would you like to scan the technical plan for architectural drift and Constitution violations?"
  after_tasks:
    command: "speckit.architecture-guard.ag-refactor-generator"
    optional: true
    prompt: "Would you like to generate architectural refactor tasks before implementation?"
  after_implement:
    command: "speckit.architecture-guard.ag-review-implementation"
    optional: true
    prompt: "Would you like to run a post-implementation architecture review?"

provides:
  commands:
    - name: "speckit.architecture-guard.ag-governed-discover"
      file: "commands/governed-discover.md"
      description: "Facilitate an architecture-aware discussion to flesh out ideas before generating a formal specification."
    - name: "speckit.architecture-guard.ag-governed-spec"
      file: "commands/governed-spec.md"
      description: "Orchestrate governed specification with memory, framework-native specification, Security Review, architecture validation, and an auto-fix loop."
    - name: "speckit.architecture-guard.ag-governed-delivery"
      file: "commands/governed-delivery.md"
      description: "Resume governed delivery from an active specification through plan and task generation, with optional Flash-Mem context, security review, architecture gates, task reconciliation, and analysis."
    - name: "speckit.architecture-guard.ag-governed-delivery-team"
      file: "commands/governed-delivery-team.md"
      description: "Run the team delivery workflow with an approved User Story before governed planning and task generation."
    - name: "speckit.architecture-guard.ag-governed-archive"
      file: "commands/governed-archive.md"
      description: "Verify, then archive a completed feature with explicit approval for changelog, memory, Git, and cleanup actions."
    - name: "speckit.architecture-guard.ag-governed-plan"
      file: "commands/governed-plan.md"
      description: "Generate and validate a technical plan with optional Flash-Mem context, Security Review, and Architecture Guard checks."
    - name: "speckit.architecture-guard.ag-governed-tasks"
      file: "commands/governed-tasks.md"
      description: "Generate or reconcile implementation tasks, then analyze security, architecture, migration, and refactor coverage."
    - name: "speckit.architecture-guard.ag-governed-implement"
      file: "commands/governed-implement.md"
      description: "Execute implementation tasks, then review the result against available security and architecture constraints."
    - name: "speckit.architecture-guard.ag-workflow"
      file: "commands/workflow.md"
      description: "Run a single architecture workflow with optional memory context and Security Review handoff."
    - name: "speckit.architecture-guard.ag-review-artifacts"
      file: "commands/review-artifacts.md"
      description: "Review specification and planning artifacts against architectural rules without reading implementation code."
    - name: "speckit.architecture-guard.ag-review-implementation"
      file: "commands/review-implementation.md"
      description: "Review implementation code or pre-implementation planning artifacts against active specifications and constitutions."
    - name: "speckit.architecture-guard.ag-violation-detection"
      file: "commands/violation-detection.md"
      description: "Detect technology-agnostic architecture violations in plans, tasks, and implementation summaries."
    - name: "speckit.architecture-guard.ag-refactor-generator"
      file: "commands/refactor-generator.md"
      description: "Convert architecture violations into non-blocking, structured refactor tasks."
    - name: "speckit.architecture-guard.ag-apply"
      file: "commands/apply.md"
      description: "Apply approved architecture refactors by updating plan and task artifacts directly."
    - name: "speckit.architecture-guard.ag-init"
      file: "commands/init.md"
      description: "Initialize or refine the project governance and architecture constitutions for Architecture Guard."
    - name: "speckit.architecture-guard.ag-init-brownfield"
      file: "commands/init-brownfield.md"
      description: "Perform brownfield-first project initialization and discovery for existing codebases."
    - name: "speckit.architecture-guard.ag-consolidate-specs"
      file: "commands/consolidate-specs.md"
      description: "Generate a compact, non-authoritative local fallback index from feature specifications."
    - name: "speckit.architecture-guard.ag-verify"
      file: "commands/verify.md"
      description: "Verify implementation against specification, design, plan, tasks, architecture rules, and repository hygiene requirements."

tags:
  - "architecture"
  - "spec-kit"
  - "review"
  - "refactor"
  - "workflow"
  - "governance"
  - "guardrails"
  - "hygiene"
