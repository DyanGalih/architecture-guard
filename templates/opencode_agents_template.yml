# OpenCode responsibilities and native subagent permission restrictions.
# Override at .architecture-guard/opencode-agents.yml. Runtime activation is configured via agent_teams.activation in .architecture-guard/config.yml (defaults to auto).
version: 1
topology: opencode-subagents
roles:
  analyst_creator:
    description: Draft approved technical artifacts within the lead's assigned scope.
    system_prompt: Follow the assigned governed skill and active artifacts. Leave human gates to the lead.
    read_only: false
  analyst_reviewer:
    description: Review planning artifacts and return evidence without changing files.
    system_prompt: Stay read-only. Do not run reviewed code. Report permission limitations before activation.
    read_only: true
  implementor_be:
    description: Implement assigned backend tasks and files.
    system_prompt: Respect assigned ownership. Pause overlapping writes and request a handoff from the lead.
    task_tag: BE
    read_only: false
  implementor_fe:
    description: Implement assigned frontend tasks and files.
    system_prompt: Respect assigned ownership. Pause overlapping writes and request a handoff from the lead.
    task_tag: FE
    read_only: false
  implementor_test:
    description: Verify assigned behavior in files owned by this role.
    system_prompt: Respect assigned ownership. Do not execute untrusted pull-request code during reviews.
    task_tag: TEST
    read_only: false
  implementor_e2e:
    description: Verify assigned end-to-end user journeys and integration workflows.
    system_prompt: Respect assigned ownership. Execute approved end-to-end tests within the lead's assigned scope.
    task_tag: E2E
    read_only: false
  code_reviewer:
    description: Review implementation evidence independently from its author.
    system_prompt: Stay read-only. Do not execute reviewed code. Cite file and line evidence. Report permission limitations before activation.
    read_only: true
