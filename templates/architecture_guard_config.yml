schema_version: "1.0"

context:
  # targeted preserves the existing Flash-Mem-first behavior.
  # budgeted applies explicit retrieval limits and enables the local fallback index.
  mode: targeted
  fallback_file: specs/system_context.md
  # regenerate refreshes a stale index; targeted skips it and opens only sources needed for named gaps.
  stale_policy: regenerate
  flash_mem:
    initial_result_limit: 5
    full_entry_limit: 3

# Optional repository hygiene policy, read by `architecture-guard hygiene` from
# `.architecture-guard/config.yml`, or from `.specify/config/repository_hygiene.yml`
# for the Spec Kit extension (the runner does not read `.specify/config/architecture_guard.yml`).
# fail_on raises matching findings to CRITICAL (blocking); warn_on reports them as WARNING.
# repository_hygiene:
#   enabled: true
#   fail_on:
#     - critical
#   warn_on:
#     - warning
#   ignore:
#     paths:
#       - docs/archive/**
