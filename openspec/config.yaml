schema: spec-driven

# Project context (shown to AI when creating artifacts).
context: |
  Repository: architecture-guard — repository-native architecture governance for SDD frameworks.
  Engineering Philosophy:
    - Ponytail principles: YAGNI, standard library preference, lazy senior mindset.
    - Conventions: memory-first workflows when Flash-Mem is available; non-blocking architecture
      drift by default; approved refactors stay small and targeted; markdown constitutions and command files are the review
      source of truth.
  
  Code Review Expectations:
    - All PRs require at least one approval.
    - Architecture Guard rules and validation must pass.
  
  Documentation Standards:
    - Feature additions must update relevant Markdown documentation.
    - Architecture rules must be documented via OpenSpec artifacts.
  
  Code Style & Linting:
    - ESLint rules are blocking (must run `npm run lint` successfully).
    - Maintain strict typing; no implicit `any`.
  
  Operational & CI Expectations:
    - CI pipeline must run tests (`npm run test`) and linter successfully before merge.
    - Test regressions or failure to build (`npm run build`) block releases.
  
  Architecture enforcement rules are defined in `openspec/architecture.md`.
  Security rules are defined in `openspec/security.md`.

# Per-artifact rules (optional).
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
